name: Scheduled Test Runs

on:
  repository_dispatch:
    types: [run-tests, send-email]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "scheduled-pages"
  cancel-in-progress: false

jobs:
  # ─── Job 1: Run tests, generate dashboard, update sheet, commit & upload ───
  run-tests:
    if: github.event.action != 'send-email'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps (on cache hit)
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - name: Run tests
        id: tests
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set +e
          npx playwright test
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Generate dashboard
        if: always()
        run: node dashboard/generate-dashboard.js

      - name: Update coverage sheet
        if: always()
        env:
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SHEET_NAME: ${{ secrets.GOOGLE_SHEETS_SHEET_NAME }}
          DASHBOARD_PUBLIC_URL: https://saira-uwc.github.io/Shunyalabs_website/
        run: node scripts/update-coverage-sheet.js || echo "Sheet update failed (non-fatal)"

      - name: Commit dashboard changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/
          if ! git diff --cached --quiet; then
            git commit -m "Update dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No dashboard changes to commit."
          fi

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1

  # ─── Job 2: Deploy dashboard to GitHub Pages ───
  deploy:
    needs: run-tests
    if: always() && needs.run-tests.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── Job 3: Send daily email report ───
  send-daily-email:
    if: github.event.action == 'send-email'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Send daily report
        env:
          PROJECT_NAME: "Shunya Labs Website Automation Report"
          REPORT_RECIPIENTS: "testsaira2001@gmail.com,sairashaik36@gmail.com"
          DASHBOARD_PUBLIC_URL: "https://saira-uwc.github.io/Shunyalabs_website/"
          EMAIL_WEB_APP_URL: ${{ secrets.EMAIL_WEB_APP_URL }}
        run: node scripts/email-daily-report.js
