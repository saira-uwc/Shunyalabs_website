name: Scheduled Test Runs

on:
  repository_dispatch:
    types: [run-tests, send-email, deploy-dashboard]
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: false
        default: 'run-tests'
        type: choice
        options:
          - run-tests
          - deploy-dashboard

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "scheduled-pages"
  cancel-in-progress: false

jobs:
  # ─── Job 1: Run tests, generate dashboard, update sheet, commit & upload ───
  run-tests:
    if: >-
      github.event.action != 'send-email' &&
      github.event.action != 'deploy-dashboard' &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'deploy-dashboard')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps (on cache hit)
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - name: Verify Playwright browser exists
        run: npx playwright install chromium --with-deps

      - name: Run tests
        id: tests
        env:
          PLAYWRIGHT_HTML_OPEN: never
          # Contact form cannot pass real reCAPTCHA in GitHub Actions; stub send-mail there only.
          CONTACT_MAIL_MOCK: "true"
        run: |
          set +e
          npx playwright test tests/modules
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Generate dashboard
        if: always()
        run: node dashboard/generate-dashboard.js

      - name: Update coverage sheet
        if: always()
        env:
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SHEET_NAME: ${{ secrets.GOOGLE_SHEETS_SHEET_NAME }}
          DASHBOARD_PUBLIC_URL: https://saira-uwc.github.io/Shunyalabs_website/
        run: node scripts/update-coverage-sheet.js || echo "Sheet update failed (non-fatal)"

      - name: Commit dashboard changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/
          if ! git diff --cached --quiet; then
            git commit -m "Update dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No dashboard changes to commit."
          fi

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1

  # ─── Job 1b: Rebuild dashboard from history (no tests) ───
  rebuild-dashboard:
    if: github.event.action == 'deploy-dashboard' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-dashboard')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild dashboard from history
        run: node dashboard/generate-dashboard.js --rebuild

      - name: Commit dashboard changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No dashboard changes to commit."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  # ─── Job 2: Deploy dashboard to GitHub Pages ───
  deploy:
    needs: [run-tests, rebuild-dashboard]
    if: always() && !cancelled() && (needs.run-tests.result == 'success' || needs.run-tests.result == 'failure' || needs.rebuild-dashboard.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── Job 2b: Auto-send email after test run if there are failures ───
  email-on-failure:
    needs: run-tests
    if: always() && needs.run-tests.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify last run has failures
        id: check-failures
        run: |
          FAILED=$(node -e "
            const fs = require('fs');
            const runs = JSON.parse(fs.readFileSync('dashboard/history/runs.json', 'utf8'));
            const sorted = runs.sort((a,b) => new Date(b.runDate) - new Date(a.runDate));
            const latest = sorted[0];
            console.log(latest ? latest.failed : 0);
          ")
          echo "failed_count=$FAILED" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -gt 0 ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
            echo "Last run has $FAILED failure(s) — sending report."
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
            echo "No test failures recorded in latest run — skipping email."
          fi

      - name: Send failure report
        if: steps.check-failures.outputs.has_failures == 'true'
        env:
          PROJECT_NAME: "Shunya Labs Website Automation Report"
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          DASHBOARD_PUBLIC_URL: "https://saira-uwc.github.io/Shunyalabs_website/"
          EMAIL_WEB_APP_URL: ${{ secrets.EMAIL_WEB_APP_URL }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
        run: node scripts/email-daily-report.js

  # ─── Job 3: Send daily email report (only if last run has failures) ───
  send-daily-email:
    if: github.event.action == 'send-email'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check if last run has failures
        id: check-failures
        run: |
          FAILED=$(node -e "
            const fs = require('fs');
            const runs = JSON.parse(fs.readFileSync('dashboard/history/runs.json', 'utf8'));
            const sorted = runs.sort((a,b) => new Date(b.runDate) - new Date(a.runDate));
            const latest = sorted[0];
            console.log(latest ? latest.failed : 0);
          ")
          echo "failed_count=$FAILED" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -gt 0 ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
            echo "Last run has $FAILED failure(s) — sending report."
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
            echo "Last run passed 100% — skipping email report."
          fi

      - name: Send daily report
        if: steps.check-failures.outputs.has_failures == 'true'
        env:
          PROJECT_NAME: "Shunya Labs Website Automation Report"
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          DASHBOARD_PUBLIC_URL: "https://saira-uwc.github.io/Shunyalabs_website/"
          EMAIL_WEB_APP_URL: ${{ secrets.EMAIL_WEB_APP_URL }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
        run: node scripts/email-daily-report.js

      - name: Skip notification
        if: steps.check-failures.outputs.has_failures == 'false'
        run: echo "✅ All tests passed — no email report needed."
