name: Scheduled Test Runs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Configure git user
        run: |
          git config user.name "Saira Automation BOT"
          git config user.email "automation-bot@users.noreply.github.com"

      - name: Run tests + update dashboard
        env:
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          DASHBOARD_PUBLIC_URL: https://saira-uwc.github.io/Shunyalabs_website/
          PLAYWRIGHT_HTML_OPEN: never
        run: bash scripts/run-tests-and-dashboard.sh || true
