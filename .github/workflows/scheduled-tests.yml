name: Scheduled Test Runs

on:
  repository_dispatch:
    types: [run-tests]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
        run: npx playwright install chromium

      - name: Configure git user
        run: |
          git config user.name "Saira Automation BOT"
          git config user.email "automation-bot@users.noreply.github.com"

      - name: Run tests + update dashboard
        env:
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SHEET_NAME: ${{ secrets.GOOGLE_SHEETS_SHEET_NAME }}
          DASHBOARD_PUBLIC_URL: https://saira-uwc.github.io/Shunyalabs_website/
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
          PLAYWRIGHT_HTML_OPEN: never
        run: bash scripts/run-tests-and-dashboard.sh || true

      - name: Trigger dashboard deployment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"deploy-dashboard"}' || echo "⚠️ Dashboard deploy trigger failed (non-fatal)"
